openapi: 3.0.3
info:
  title: eSPPD Audit Service
  version: 0.1.0
servers:
  - url: http://localhost:8008
paths:
  /v1/audit/logs:
    get:
      summary: Query audit logs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: resource_type
          schema: { type: string }
        - in: query
          name: user_id
          schema: { type: integer, format: int64 }
        - in: query
          name: from
          description: RFC3339 timestamp
          schema: { type: string }
        - in: query
          name: to
          description: RFC3339 timestamp
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  limit: { type: integer }
                  offset: { type: integer }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: integer, format: int64, nullable: true }
        user_id: { type: integer, format: int64 }
        role: { type: string }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        metadata: { type: object }
        timestamp: { type: string }
