name: esppd

services:
  postgres:
    image: postgres:16-alpine
    container_name: esppd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esppd}
      POSTGRES_USER: ${POSTGRES_USER:-esppd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esppd_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: esppd-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine
    container_name: esppd-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    container_name: esppd-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb -p local/${MINIO_BUCKET:-esppd-docs} || true;
      mc anonymous set download local/${MINIO_BUCKET:-esppd-docs} || true;
      "

  kong:
    image: kong:3.7
    container_name: esppd-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./docker/kong/kong.yml:/kong/kong.yml:ro
    depends_on:
      - auth-service
      - spd-service
      - approval-service
      - document-service
      - notification-service
      - reporting-service
      - budget-service
      - audit-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  spd-service:
    build:
      context: .
      dockerfile: services/spd-service/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8002:8002"

  approval-service:
    build:
      context: .
      dockerfile: services/approval-service/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8003:8003"

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8004:8004"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8005:8005"

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting-service/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8006:8006"

  budget-service:
    build:
      context: .
      dockerfile: services/budget-service/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8007:8007"

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8008:8008"

  prometheus:
    image: prom/prometheus:latest
    container_name: esppd-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - spd-service
      - approval-service
      - document-service
      - notification-service
      - reporting-service
      - budget-service
      - audit-service

  grafana:
    image: grafana/grafana:latest
    container_name: esppd-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
